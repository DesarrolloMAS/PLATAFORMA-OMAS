<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PREPARACIÓN Y CONTROL DE MEJORANTE</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --bg-color: #0B0E14;
            --panel-bg: #151A22;
            --accent: #00F0FF;
            --accent-glow: rgba(0, 240, 255, 0.4);
            --accent-hover: #00D1DF;
            --text-main: #E2E8F0;
            --text-muted: #94A3B8;
            --border-color: #1E293B;
            --input-bg: #0F172A;
            --danger: #FF3366;
            --warning: #FFB000;
            --danger-glow: rgba(255, 51, 102, 0.4);
            --r-lg: 12px;
            --r-md: 8px;
            --r-sm: 4px;
        }

        .btn-back {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: var(--r-sm);
            font-family: 'Space Mono', monospace;
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s;
            white-space: nowrap;
            display: inline-block;
        }

        .btn-back:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(0, 240, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Barlow', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            padding: 40px 20px;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent);
            padding: 30px;
            border-radius: var(--r-md);
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .header-box::before {
            content: "V1 JSON";
            position: absolute;
            top: 20px;
            right: -30px;
            background: var(--accent);
            color: var(--bg-color);
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 40px;
            transform: rotate(45deg);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .main-title {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sub-title {
            color: var(--text-muted);
            font-size: 14px;
        }

        .section-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--r-md);
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .section-card:hover {
            border-color: rgba(0, 240, 255, 0.3);
            box-shadow: 0 5px 20px rgba(0, 240, 255, 0.05);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px dashed var(--border-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .section-title span {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            background: rgba(0, 240, 255, 0.1);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: var(--r-sm);
            border: 1px solid rgba(0, 240, 255, 0.2);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-control {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 14px;
            border-radius: var(--r-sm);
            font-family: 'Barlow', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
            width: 100%;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.1);
            background: rgba(0, 240, 255, 0.02);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2300F0FF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 14px top 50%;
            background-size: 10px auto;
            padding-right: 30px;
            cursor: pointer;
        }

        select.form-control option {
            background-color: var(--panel-bg);
            color: var(--text-main);
        }

        input[type="date"].form-control,
        input[type="number"].form-control {
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            color: var(--accent);
        }

        input[readonly].form-control {
            background-color: rgba(255, 255, 255, 0.02);
            color: var(--accent);
            border-color: var(--border-color);
        }

        .btn-submit {
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 16px 30px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
            border-radius: var(--r-sm);
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 0 15px var(--accent-glow);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background: #fff;
            color: var(--bg-color);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .system-status {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10B981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10B981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(16, 185, 129, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        .mejorante-row {
            display: grid;
            grid-template-columns: 2fr 1.5fr 1.5fr 1fr;
            gap: 15px;
            align-items: end;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 768px) {
            .mejorante-row {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }

        .mejorante-name {
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            height: 44px;
            /* match input height */
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header-box">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1 class="main-title">Preparación y Control de Mejorante</h1>
                    <div class="sub-title">Registro y trazabilidad de mejorantes (V1 JSON Persistente)</div>
                </div>
                <a href="../menu_almacen.html" class="btn-back">← VOLVER</a>
            </div>
        </div>

        <form id="mejoranteForm">
            <!-- INFORMACIÓN GENERAL -->
            <div class="section-card">
                <div class="section-title"><span>01</span> Información General</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Fecha</label>
                        <input type="date" name="fecha" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Referencia</label>
                        <input type="text" name="referencia" class="form-control" placeholder="Ej: Mejorante Pan"
                            required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Lote</label>
                        <input type="text" name="lote" class="form-control" placeholder="Ej: L-001" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Vence</label>
                        <input type="date" name="vence" class="form-control" required>
                    </div>
                    <div class="form-group full">
                        <label class="form-label">Tiempo Mezcla (Min)</label>
                        <input type="number" name="tiempo_mezcla" class="form-control" placeholder="Minutos" required
                            min="0">
                    </div>
                </div>
            </div>

            <!-- MEJORANTES -->
            <div class="section-card">
                <div class="section-title"><span>02</span> Ingredientes del Mejorante</div>

                <div class="mejorante-row" style="display:none;" id="headers-desktop">
                    <div class="form-label" style="color:var(--accent)">Mejorante</div>
                    <div class="form-label" style="color:var(--accent)">Lote</div>
                    <div class="form-label" style="color:var(--accent)">Fecha Vencimiento</div>
                    <div class="form-label" style="color:var(--accent)">Cantidad</div>
                </div>

                <!-- FILAS -->
                <script>
                    if (window.innerWidth > 768) {
                        document.getElementById('headers-desktop').style.display = 'grid';
                    }
                    const mejorantes = [
                        "Grindamyl A1000",
                        "Powerbake 7200",
                        "ADA 50%",
                        "Ácido Ascórbico",
                        "Surebake 900",
                        "Powerbake 4200",
                        "Granozyme OXD"
                    ];

                    mejorantes.forEach((m, index) => {
                        const id = m.toLowerCase().replace(/[^a-z0-9]/g, '_');
                        document.write(`
                    <div class="mejorante-row">
                        <div class="mejorante-name">
                            ${m}
                        </div>
                        <div class="form-group">
                            <label class="form-label" style="display: ${window.innerWidth <= 768 ? 'block' : 'none'}">Lote</label>
                            <input type="text" name="lote_${id}" class="form-control" placeholder="Lote">
                        </div>
                        <div class="form-group">
                            <label class="form-label" style="display: ${window.innerWidth <= 768 ? 'block' : 'none'}">Vencimiento</label>
                            <input type="date" name="vencimiento_${id}" class="form-control">
                        </div>
                        <div class="form-group">
                            <label class="form-label" style="display: ${window.innerWidth <= 768 ? 'block' : 'none'}">Cantidad</label>
                            <input type="number" step="0.01" name="cantidad_${id}" class="form-control cant-input" placeholder="0.00">
                        </div>
                    </div>
                    `);
                    });
                </script>
            </div>

            <!-- TOTALES Y FIRMAS -->
            <div class="section-card">
                <div class="section-title"><span>03</span> Totales y Firmas</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">TOTAL (Autocalculado)</label>
                        <input type="number" step="0.01" name="total" id="total_calculado" class="form-control" readonly
                            value="0">
                    </div>
                    <div class="form-group">
                        <label class="form-label">DEVOLUCIÓN</label>
                        <input type="number" step="0.01" name="devolucion" class="form-control" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label class="form-label">REALIZÓ</label>
                        <input type="text" name="realiza" class="form-control" placeholder="Nombre completo" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">VERIFICÓ</label>
                        <input type="text" name="verifica" class="form-control" placeholder="Nombre completo" required>
                    </div>
                    <div class="form-group full">
                        <label class="form-label">OBSERVACIONES</label>
                        <textarea name="observaciones" class="form-control" rows="3"
                            placeholder="Comentarios adicionales..."></textarea>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btnGuardar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                    <polyline points="17 21 17 13 7 13 7 21"></polyline>
                    <polyline points="7 3 7 8 15 8"></polyline>
                </svg>
                REGISTRAR FORMATO
            </button>

            <div class="system-status">
                <div class="status-dot"></div>
                SISTEMA JSON INTERCONECTADO - AUTO-DETECCIÓN DE SEDE ACTIVA
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hoy = new Date().toISOString().split('T')[0];
            document.querySelector('[name="fecha"]').value = hoy;

            // Auto-cálculo de totales
            const cants = document.querySelectorAll('.cant-input');
            cants.forEach(c => {
                c.addEventListener('input', () => {
                    let total = 0;
                    cants.forEach(input => {
                        const val = parseFloat(input.value);
                        if (!isNaN(val)) total += val;
                    });
                    document.getElementById('total_calculado').value = total.toFixed(2);
                });
            });
        });

        document.getElementById('mejoranteForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const btn = document.getElementById('btnGuardar');
            const overlayText = btn.innerHTML;

            btn.innerHTML = 'PROCESANDO JSON...';
            btn.disabled = true;
            btn.style.opacity = '0.7';

            const formData = new FormData(this);
            const jsonData = {};
            formData.forEach((value, key) => { jsonData[key] = value; });

            fetch('procesar.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(jsonData)
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        Swal.fire({
                            title: '¡REGISTRADO!',
                            text: 'Formato guardado estructuralmente vía JSON.',
                            icon: 'success',
                            background: '#151A22',
                            color: '#fff',
                            confirmButtonColor: '#00F0FF'
                        }).then(() => {
                            window.location.href = 'rev_control_mejorante.php';
                        });
                    } else {
                        Swal.fire({
                            title: 'Error del Sistema',
                            text: data.message || 'Error en el túnel JSON.',
                            icon: 'error',
                            background: '#151A22',
                            color: '#fff',
                            confirmButtonColor: '#FF3366'
                        });
                        btn.innerHTML = overlayText;
                        btn.disabled = false;
                        btn.style.opacity = '1';
                    }
                })
                .catch(err => {
                    console.error('Error:', err);
                    Swal.fire({
                        title: 'Error de Conexión',
                        text: 'Hubo un problema al conectar con el servidor.',
                        icon: 'error',
                        background: '#151A22',
                        color: '#fff',
                        confirmButtonColor: '#FF3366'
                    });
                    btn.innerHTML = overlayText;
                    btn.disabled = false;
                    btn.style.opacity = '1';
                });
        });
    </script>

</body>

</html>

    <script>
        // Visibilidad por área operativa: admin/menu_operaciones_visibles.php
        // dice qué botones ve la sesión (se administra en admin/menu_admin.php
        // → "Visibilidad del Menú de Operaciones"; los admins ven todo). Los
        // botones visibles se reacomodan en una figura simétrica para que no
        // queden huecos. Mientras no responde el servidor, .hub lleva
        // data-filtro="pendiente" y los nodos no se muestran (ver
        // menu_principal.css), así nadie alcanza a ver botones que no le tocan.
        (async function filtrarMenu() {
            const hub = document.querySelector('.hub');
            const svg = hub.querySelector('.hub-lines');
            // Orden horario desde las 12, igual al hexágono completo.
            const ORDEN = ['usuario', 'produccion', 'central_documental', 'calendario', 'mantenimiento', 'almacen'];
            // Cupos por cantidad de botones (esquema, cupos en orden horario).
            const LAYOUTS = {
                1: ['hex', [1]],
                2: ['hex', [1, 4]],
                3: ['hex', [1, 3, 5]],
                4: ['quad', [4, 1, 2, 3]],
                5: ['hex', [1, 2, 3, 5, 6]],
                6: ['hex', [1, 2, 3, 4, 5, 6]],
            };
            // Extremo del spoke y marker sobre el .ring de cada cupo (hex = radio de .hub--spread).
            const GEOMETRIA = {
                hex: {
                    1: [500, 180, 500, 280], 2: [786, 346, 699, 395], 3: [786, 674, 699, 625],
                    4: [500, 830, 500, 740], 5: [214, 674, 301, 625], 6: [214, 346, 301, 395],
                },
                quad: {
                    1: [719, 291, 663, 347], 2: [719, 729, 663, 673],
                    3: [281, 729, 337, 673], 4: [281, 291, 337, 347],
                },
            };

            let visibles = ['usuario']; // si falla la consulta, solo lo que es para todos
            try {
                const res = await fetch('admin/menu_operaciones_visibles.php', { cache: 'no-store' });
                if (res.status === 401) { window.location.href = '../index.php?motivo=sesion'; return; }
                const data = await res.json();
                if (data.status === 'success') visibles = data.nodos;
            } catch (err) { console.error(err); }

            const anchors = Array.from(hub.querySelectorAll('.hub-node-anchor[data-nodo]'));
            const mostrar = ORDEN
                .filter(n => visibles.includes(n))
                .map(n => anchors.find(a => a.dataset.nodo === n))
                .filter(Boolean);
            anchors.forEach(a => { if (!mostrar.includes(a)) a.remove(); });

            // Botón "Datos" (arriba a la derecha): no es un nodo del hub, solo se muestra o no.
            const btnDatos = document.querySelector('.menu-exit[data-nodo="datos"]');
            if (btnDatos) {
                if (visibles.includes('datos')) btnDatos.hidden = false; else btnDatos.remove();
            }

            const [esquema, cupos] = LAYOUTS[mostrar.length] || LAYOUTS[6];
            svg.querySelectorAll('.spoke, .marker').forEach(el => el.remove());
            const NS = 'http://www.w3.org/2000/svg';
            const lineas = [], marcas = [];
            mostrar.forEach((a, i) => {
                const cupo = cupos[i];
                a.className = a.className.replace(/\bhub-node-anchor--(hex|quad|pos)-\d+\b/g, '').trim()
                    + ` hub-node-anchor--${esquema}-${cupo}`;
                const [x2, y2, mx, my] = GEOMETRIA[esquema][cupo];
                const l = document.createElementNS(NS, 'line');
                Object.entries({ class: 'spoke', x1: 500, y1: 510, x2, y2 }).forEach(([k, v]) => l.setAttribute(k, v));
                lineas.push(l);
                const c = document.createElementNS(NS, 'circle');
                Object.entries({ class: 'marker', cx: mx, cy: my, r: 7 }).forEach(([k, v]) => c.setAttribute(k, v));
                marcas.push(c);
            });
            [...lineas, ...marcas].forEach(el => svg.appendChild(el));

            hub.removeAttribute('data-filtro');
        })();

        // Si hay notificaciones sin leer, el nodo "Usuario" emite las mismas
        // ondas que la bandeja en menu_usuario.html (.is-pending, ver
        // menu_principal.css), para guiar al usuario hacia su bandeja.
        (async function avisoBandeja() {
            try {
                const res = await fetch('usuario/bandeja_api.php?accion=contar', { cache: 'no-store' });
                const data = await res.json();
                const nodo = document.getElementById('nodo-usuario');
                if (data.status === 'success' && data.no_leidas > 0) {
                    nodo.classList.add('is-pending');
                    const texto = data.no_leidas === 1 ? '1 notificación pendiente' : data.no_leidas + ' notificaciones pendientes';
                    nodo.title = texto + ' en tu bandeja de entrada';
                    nodo.setAttribute('aria-label', 'Usuario, ' + texto);
                }
            } catch (err) { console.error(err); }
        })();
    </script>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSPECCIÓN CONTROL DE OPERACIONES</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --bg-color: #0B0E14;
            --panel-bg: #151A22;
            --accent: #00F0FF;
            --accent-glow: rgba(0, 240, 255, 0.4);
            --accent-hover: #00D1DF;
            --text-main: #E2E8F0;
            --text-muted: #94A3B8;
            --border-color: #1E293B;
            --input-bg: #0F172A;
            --danger: #FF3366;
            --warning: #FFB000;
            --danger-glow: rgba(255, 51, 102, 0.4);
            --r-lg: 12px;
            --r-md: 8px;
            --r-sm: 4px;
        }

        .btn-back {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: var(--r-sm);
            font-family: 'Space Mono', monospace;
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s;
            white-space: nowrap;
            display: inline-block;
        }
        .btn-back:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(0, 240, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Barlow', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            padding: 40px 20px;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent);
            padding: 30px;
            border-radius: var(--r-md);
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .header-box::before {
            content: "V1 JSON";
            position: absolute;
            top: 20px;
            right: -30px;
            background: var(--accent);
            color: var(--bg-color);
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 40px;
            transform: rotate(45deg);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .main-title {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sub-title {
            color: var(--text-muted);
            font-size: 14px;
        }

        .section-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--r-md);
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .section-card:hover {
            border-color: rgba(0, 240, 255, 0.3);
            box-shadow: 0 5px 20px rgba(0, 240, 255, 0.05);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px dashed var(--border-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .section-title span {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            background: rgba(0, 240, 255, 0.1);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: var(--r-sm);
            border: 1px solid rgba(0, 240, 255, 0.2);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-control {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 14px;
            border-radius: var(--r-sm);
            font-family: 'Barlow', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
            width: 100%;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.1);
            background: rgba(0, 240, 255, 0.02);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2300F0FF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 14px top 50%;
            background-size: 10px auto;
            padding-right: 30px;
            cursor: pointer;
        }

        select.form-control option {
            background-color: var(--panel-bg);
            color: var(--text-main);
        }

        input[type="date"].form-control {
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            color: var(--accent);
        }

        input[readonly].form-control {
            background-color: rgba(255,255,255,0.02);
            color: var(--accent);
            border-color: var(--border-color);
        }

        .btn-submit {
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 16px 30px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
            border-radius: var(--r-sm);
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 0 15px var(--accent-glow);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background: #fff;
            color: var(--bg-color);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .system-status {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10B981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10B981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .results-box {
            background: rgba(0, 240, 255, 0.05);
            border: 1px dashed var(--accent);
            border-radius: var(--r-md);
            padding: 20px;
            margin-top: 20px;
            display: flex;
            justify-content: space-around;
        }

        .result-item {
            text-align: center;
        }

        .result-value {
            font-family: 'Space Mono', monospace;
            font-size: 24px;
            font-weight: 700;
            color: var(--accent);
        }

        .result-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1 class="main-title">Inspección Control de Operaciones</h1>
                <div class="sub-title">PPR Gestión de la Producción — Procedimiento Control de Operaciones (V1 JSON Persistente)</div>
            </div>
            <a href="../menu_produccion.html" class="btn-back">← VOLVER</a>
        </div>
    </div>

    <form id="inspeccionForm">
        <!-- INFORMACIÓN GENERAL -->
        <div class="section-card">
            <div class="section-title"><span>01</span> Información General</div>
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Fecha</label>
                    <input type="date" name="fecha" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Línea de Producción / Proceso</label>
                    <input type="text" name="linea_produccion" class="form-control" placeholder="Ej: Línea 1 - Molienda" required>
                </div>
                <div class="form-group full">
                    <label class="form-label">Responsable de Inspección</label>
                    <input type="text" name="responsable_inspeccion" class="form-control" placeholder="Nombre del responsable" required>
                </div>
            </div>
        </div>

        <!-- ÍTEMS A EVALUAR -->
        <div class="section-card">
            <div class="section-title"><span>02</span> Ítems a Evaluar</div>
            <div class="form-grid" style="grid-template-columns: 1fr;">

                <div class="form-group">
                    <label class="form-label">Identificación Procesos Clave — Documentación (diagramas de flujo y descripción de las etapas de proceso documentadas)</label>
                    <select name="eval_id_procesos_docs" class="form-control eval-item" required>
                        <option value="">Seleccione...</option>
                        <option value="1">CUMPLE (1)</option>
                        <option value="0">NO CUMPLE (0)</option>
                        <option value="NA">NO APLICA (N/A)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Identificación Procesos Clave — Impacto (y su impacto en la inocuidad, calidad y legalidad del producto)</label>
                    <select name="eval_id_procesos_impacto" class="form-control eval-item" required>
                        <option value="">Seleccione...</option>
                        <option value="1">CUMPLE (1)</option>
                        <option value="0">NO CUMPLE (0)</option>
                        <option value="NA">NO APLICA (N/A)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Especificaciones de Proceso (debidamente documentadas)</label>
                    <select name="eval_especificaciones_proceso" class="form-control eval-item" required>
                        <option value="">Seleccione...</option>
                        <option value="1">CUMPLE (1)</option>
                        <option value="0">NO CUMPLE (0)</option>
                        <option value="NA">NO APLICA (N/A)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Identificación de Equipos y Ajustes Críticos (para garantizar la inocuidad, calidad y legalidad del producto)</label>
                    <select name="eval_equipos_ajustes" class="form-control eval-item" required>
                        <option value="">Seleccione...</option>
                        <option value="1">CUMPLE (1)</option>
                        <option value="0">NO CUMPLE (0)</option>
                        <option value="NA">NO APLICA (N/A)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Protección Controles de Proceso (definidos y documentados en el procedimiento)</label>
                    <select name="eval_proteccion_controles" class="form-control eval-item" required>
                        <option value="">Seleccione...</option>
                        <option value="1">CUMPLE (1)</option>
                        <option value="0">NO CUMPLE (0)</option>
                        <option value="NA">NO APLICA (N/A)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Vigilancia del Proceso (la línea de producción cuenta con mecanismos de vigilancia, según lo establecido en el procedimiento)</label>
                    <select name="eval_vigilancia_proceso" class="form-control eval-item" required>
                        <option value="">Seleccione...</option>
                        <option value="1">CUMPLE (1)</option>
                        <option value="0">NO CUMPLE (0)</option>
                        <option value="NA">NO APLICA (N/A)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Gestión de Cambios de Producto (se aplican los controles pertinentes durante los cambios de producto en la línea)</label>
                    <select name="eval_gestion_cambios" class="form-control eval-item" required>
                        <option value="">Seleccione...</option>
                        <option value="1">CUMPLE (1)</option>
                        <option value="0">NO CUMPLE (0)</option>
                        <option value="NA">NO APLICA (N/A)</option>
                    </select>
                </div>

            </div>

            <div class="results-box">
                <div class="result-item">
                    <div class="result-value" id="resTotal">0</div>
                    <div class="result-label">Total (Suma)</div>
                </div>
                <div class="result-item">
                    <div class="result-value" id="resEvaluados">0</div>
                    <div class="result-label">Items Evaluados</div>
                </div>
                <div class="result-item">
                    <div class="result-value" id="resPorcentaje">0%</div>
                    <div class="result-label">% Cumplimiento</div>
                </div>
            </div>

            <input type="hidden" name="total_suma" id="inputTotal">
            <input type="hidden" name="porcentaje_cumplimiento" id="inputPorcentaje">
        </div>

        <button type="submit" class="btn-submit" id="btnGuardar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            REGISTRAR INSPECCIÓN
        </button>

        <div class="system-status">
            <div class="status-dot"></div>
            SISTEMA JSON INTERCONECTADO - AUTO-DETECCIÓN DE SEDE ACTIVA
        </div>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const hoy = new Date().toISOString().split('T')[0];
        document.querySelector('[name="fecha"]').value = hoy;

        document.querySelectorAll('.eval-item').forEach(select => {
            select.addEventListener('change', calcularResultados);
        });
    });

    function calcularResultados() {
        const selects = document.querySelectorAll('.eval-item');
        let sumaTotal = 0;
        let itemsEvaluados = 0;

        selects.forEach(select => {
            const val = select.value;
            if (val === '1' || val === '0') {
                itemsEvaluados++;
                sumaTotal += parseInt(val);
            }
        });

        let porcentaje = 0;
        if (itemsEvaluados > 0) {
            porcentaje = (sumaTotal / itemsEvaluados) * 100;
        }

        document.getElementById('resTotal').innerText = sumaTotal;
        document.getElementById('resEvaluados').innerText = itemsEvaluados;
        document.getElementById('resPorcentaje').innerText = porcentaje.toFixed(1) + '%';

        document.getElementById('inputTotal').value = sumaTotal;
        document.getElementById('inputPorcentaje').value = porcentaje.toFixed(2);
    }

    document.getElementById('inspeccionForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const btn = document.getElementById('btnGuardar');
        const overlayText = btn.innerHTML;

        btn.innerHTML = 'PROCESANDO JSON...';
        btn.disabled = true;
        btn.style.opacity = '0.7';

        const formData = new FormData(this);
        const jsonData = {};
        formData.forEach((value, key) => { jsonData[key] = value; });

        fetch('procesar.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(jsonData)
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                Swal.fire({
                    title: '¡REGISTRADO!',
                    text: 'Inspección de Control de Operaciones guardada correctamente vía JSON.',
                    icon: 'success',
                    background: '#151A22',
                    color: '#fff',
                    confirmButtonColor: '#00F0FF'
                }).then(() => {
                    window.location.reload();
                });
            } else {
                Swal.fire({
                    title: 'Error del Sistema',
                    text: data.message || 'Error en el túnel JSON.',
                    icon: 'error',
                    background: '#151A22',
                    color: '#fff',
                    confirmButtonColor: '#FF3366'
                });
                btn.innerHTML = overlayText;
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        })
        .catch(err => {
            console.error('Error:', err);
            Swal.fire({
                title: 'Error de Conexión',
                text: 'No se pudo conectar con el servidor. Verifique su conexión.',
                icon: 'error',
                background: '#151A22',
                color: '#fff',
                confirmButtonColor: '#FF3366'
            });
            btn.innerHTML = overlayText;
            btn.disabled = false;
            btn.style.opacity = '1';
        });
    });
</script>

</body>
</html>

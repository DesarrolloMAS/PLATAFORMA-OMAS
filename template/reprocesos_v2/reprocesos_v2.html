<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTROL DE REPROCESOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --bg-color: #0B0E14;
            --panel-bg: #151A22;
            --accent: #00F0FF;
            --accent-glow: rgba(0, 240, 255, 0.4);
            --accent-hover: #00D1DF;
            --text-main: #E2E8F0;
            --text-muted: #94A3B8;
            --border-color: #1E293B;
            --input-bg: #0F172A;
            --danger: #FF3366;
            --warning: #FFB000;
            --danger-glow: rgba(255, 51, 102, 0.4);
            --r-lg: 12px;
            --r-md: 8px;
            --r-sm: 4px;
        }

        .btn-back {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: var(--r-sm);
            font-family: 'Space Mono', monospace;
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s;
            white-space: nowrap;
            display: inline-block;
        }
        .btn-back:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(0, 240, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Barlow', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            padding: 40px 20px;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent);
            padding: 30px;
            border-radius: var(--r-md);
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .header-box::before {
            content: "V1 JSON";
            position: absolute;
            top: 20px;
            right: -30px;
            background: var(--accent);
            color: var(--bg-color);
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 40px;
            transform: rotate(45deg);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .main-title {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sub-title {
            color: var(--text-muted);
            font-size: 14px;
        }

        .section-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--r-md);
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .section-card:hover {
            border-color: rgba(0, 240, 255, 0.3);
            box-shadow: 0 5px 20px rgba(0, 240, 255, 0.05);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px dashed var(--border-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .section-title span {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            background: rgba(0, 240, 255, 0.1);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: var(--r-sm);
            border: 1px solid rgba(0, 240, 255, 0.2);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-control {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 14px;
            border-radius: var(--r-sm);
            font-family: 'Barlow', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
            width: 100%;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.1);
            background: rgba(0, 240, 255, 0.02);
        }

        input[type="date"].form-control,
        input[type="time"].form-control {
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            color: var(--accent);
        }

        .btn-submit {
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 16px 30px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
            border-radius: var(--r-sm);
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 0 15px var(--accent-glow);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background: #fff;
            color: var(--bg-color);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .system-status {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10B981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10B981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1 class="main-title">Control de Reprocesos</h1>
                <div class="sub-title">Registro de Alistamiento (V1 JSON Persistente)</div>
            </div>
            <a href="../menu_almacen.html" class="btn-back">← MENÚ ALMACÉN</a>
        </div>
    </div>

    <form id="reprocesoForm">
        <div class="section-card">
            <div class="section-title"><span>01</span> Alistamiento de Almacén</div>
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Fecha de Alistamiento</label>
                    <input type="date" name="fecha_alistamiento" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Responsable de Alistamiento</label>
                    <input type="text" name="responsable_alistamiento" class="form-control" placeholder="Nombre del responsable" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Producto</label>
                    <input type="text" name="producto" class="form-control" placeholder="Nombre del producto" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Lote</label>
                    <input type="text" name="lote" class="form-control" placeholder="Ej: L-1234" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Hora</label>
                    <input type="time" name="hora" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Cantidad (KG)</label>
                    <input type="number" step="any" min="0.01" name="cantidad" class="form-control" placeholder="Peso en KG" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Proceso Sugerido</label>
                    <input type="text" name="proceso_sugerido" class="form-control" placeholder="Ej: Reincorporación a molienda">
                </div>
                <div class="form-group full">
                    <label class="form-label">Motivo del Reproceso</label>
                    <textarea name="motivo" class="form-control" rows="3" placeholder="Describa el motivo" required></textarea>
                </div>
            </div>
        </div>

        <button type="submit" class="btn-submit" id="btnGuardar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            REGISTRAR PENDIENTE
        </button>

        <div class="system-status">
            <div class="status-dot"></div>
            SISTEMA JSON INTERCONECTADO - AUTO-DETECCIÓN DE SEDE ACTIVA
        </div>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const hoy = new Date().toISOString().split('T')[0];
        document.querySelector('[name="fecha_alistamiento"]').value = hoy;
    });

    document.getElementById('reprocesoForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const btn = document.getElementById('btnGuardar');
        const overlayText = btn.innerHTML;

        btn.innerHTML = 'PROCESANDO JSON...';
        btn.disabled = true;
        btn.style.opacity = '0.7';

        const formData = new FormData(this);
        const jsonData = {};
        formData.forEach((value, key) => { jsonData[key] = value; });

        fetch('procesar.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(jsonData)
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                Swal.fire({
                    title: '¡REGISTRADO!',
                    text: 'Pendiente de reproceso guardado vía JSON.',
                    icon: 'success',
                    background: '#151A22',
                    color: '#fff',
                    confirmButtonColor: '#00F0FF'
                }).then(() => {
                    window.location.href = '../menu_almacen.html';
                });
            } else {
                Swal.fire({
                    title: 'Error del Sistema',
                    text: data.message || 'Error en el túnel JSON.',
                    icon: 'error',
                    background: '#151A22',
                    color: '#fff',
                    confirmButtonColor: '#FF3366'
                });
                btn.innerHTML = overlayText;
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        })
        .catch(err => {
            console.error('Error:', err);
            Swal.fire({
                title: 'Error de Conexión',
                text: 'No se pudo contactar procesar.php.',
                icon: 'error',
                background: '#151A22',
                color: '#fff',
                confirmButtonColor: '#FF3366'
            });
            btn.innerHTML = overlayText;
            btn.disabled = false;
            btn.style.opacity = '1';
        });
    });
</script>

</body>
</html>

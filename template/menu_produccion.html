    <script>
        // Esconder "Sección Sur" para sede ZC, sin dejar el hueco notorio en
        // el hexágono: los otros 5 nodos pasan a su data-pos-zc (pentágono
        // pos-1..5, sin cupo vacío) y se cambia cuál .hub-lines se muestra.
        //
        // Esta página trae [data-unroll-entrance] (ver crear-menu-hub.md
        // sección 4): initHubUnrollEntrance() en dist/app.js lee la posición
        // final de cada .hub-node ya con sus clases puestas para calcular la
        // animación de "desenrollado" — si esto corriera async (fetch normal,
        // como en menu_administracion.html) llegaría tarde: los nodos ya
        // habrían arrancado su animación hacia la posición hexagonal vieja
        // y se verían saltar a la pentagonal a medio vuelo. Por eso acá sí
        // se justifica un XHR síncrono: bloquea el parseo antes de que se
        // cargue dist/app.js más abajo, así initHubUnrollEntrance() siempre
        // lee las clases ya correctas.
        (function () {
            var sede = null;
            try {
                var xhr = new XMLHttpRequest();
                xhr.open("GET", "get_session_info.php", false);
                xhr.send(null);
                sede = JSON.parse(xhr.responseText).sede;
            } catch (e) {
                return;
            }
            if (sede !== "ZC") return;

            var nodoSur = document.getElementById("nodoSeccionSur");
            if (nodoSur) nodoSur.remove();

            document.querySelectorAll(".hub-node-anchor[data-pos-zc]").forEach(function (anchor) {
                Array.from(anchor.classList).forEach(function (c) {
                    if (c.indexOf("hub-node-anchor--hex-") === 0) anchor.classList.remove(c);
                });
                anchor.classList.add("hub-node-anchor--" + anchor.dataset.posZc);
            });

            var hexLines = document.getElementById("hubLinesHex");
            var posLines = document.getElementById("hubLinesPos");
            if (hexLines) hexLines.style.display = "none";
            if (posLines) posLines.style.display = "";
        })();
    </script>

    <script>
        // Nodos solo-admin (Bandeja de Entrada, Gestión de Usuarios): se
        // muestran únicamente si la sesión es 'adm' (misma verificación que
        // el engranaje central). Si lo es, la bandeja emite ondas
        // (.is-pending) cuando hay no leídas, igual que en menu_usuario.html.
        (async function nodosAdmin() {
            try {
                const res = await fetch('verificar_admin.php', { cache: 'no-store' });
                const data = await res.json();
                if (!data.esAdmin) return;
                document.querySelector('.hub').classList.add('is-admin');

                const resB = await fetch('usuario/bandeja_api.php?accion=contar', { cache: 'no-store' });
                const dataB = await resB.json();
                const nodo = document.getElementById('nodo-bandeja');
                if (dataB.status === 'success' && dataB.no_leidas > 0) {
                    nodo.classList.add('is-pending');
                    const texto = dataB.no_leidas === 1 ? '1 notificación pendiente' : dataB.no_leidas + ' notificaciones pendientes';
                    nodo.title = texto;
                    nodo.setAttribute('aria-label', 'Bandeja de entrada, ' + texto);
                }
            } catch (err) { console.error(err); }
        })();
    </script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Inspección de Etiquetado — MAS</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --ok:#16a34a;--ok-bg:#f0fdf4;--ok-bd:#bbf7d0;
  --fail:#dc2626;--fail-bg:#fef2f2;--fail-bd:#fecaca;
  --na:#d97706;--na-bg:#fffbeb;--na-bd:#fde68a;
  --bg:#f8fafc;--bg2:#f1f5f9;--bg3:#e8edf2;--bg4:#dde3ea;
  --text:#1e293b;--text2:#475569;--text3:#94a3b8;
  --border:#e2e8f0;--border2:#cbd5e1;--border3:#b0bec5;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);color:var(--text);
  padding:24px 12px 60px;
  display:flex;flex-direction:column;align-items:center;
}

/* ══ DOCUMENT SHELL ══ */
.doc{
  width:100%;max-width:1200px;
  border:1.5px solid var(--border3);
  border-radius:10px;overflow:hidden;
  background:#fff;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

/* ══ CABECERA PRINCIPAL ══ */
.doc-header{
  display:grid;
  grid-template-columns:110px 1fr 170px;
  border-bottom:1.5px solid var(--border3);
  background:var(--bg2);
}
.logo-cell{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:12px 10px;border-right:1.5px solid var(--border3);
  gap:2px;
}
.logo-main{font-size:26px;font-weight:700;letter-spacing:.12em;color:var(--text);}
.logo-sub{font-family:'DM Mono',monospace;font-size:7px;color:var(--text3);letter-spacing:.08em;text-align:center;margin-top:2px;}
.header-center{
  padding:0;display:flex;flex-direction:column;
}
.header-title-block{
  padding:8px 16px 6px;
  border-bottom:1px solid var(--border2);
  text-align:center;
}
.header-sup{font-family:'DM Mono',monospace;font-size:8px;color:var(--text3);letter-spacing:.12em;text-transform:uppercase;}
.header-title{font-size:13px;font-weight:700;color:var(--text);letter-spacing:.04em;}
.header-fields{display:flex;flex-wrap:wrap;gap:0;padding:0;}
.hf{
  display:flex;align-items:baseline;gap:6px;
  padding:7px 16px;border-right:1px solid var(--border);
  flex:1;
}
.hf-lbl{font-family:'DM Mono',monospace;font-size:9px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;}
.hf-val{font-family:'DM Mono',monospace;font-size:12px;font-weight:600;color:var(--text);border-bottom:1px solid var(--border2);min-width:80px;padding-bottom:1px;}
/* Doc codes column (right) — mirrors physical form */
.header-codes{
  border-left:1.5px solid var(--border3);
  display:flex;flex-direction:column;
}
.code-row{
  display:flex;align-items:center;
  border-bottom:1px solid var(--border2);
  flex:1;
}
.code-row:last-child{border-bottom:none;}
.code-lbl{
  font-family:'DM Mono',monospace;font-size:8px;color:var(--text3);
  letter-spacing:.08em;text-transform:uppercase;
  padding:4px 8px;border-right:1px solid var(--border2);
  min-width:60px;background:var(--bg3);
}
.code-val{
  font-family:'DM Mono',monospace;font-size:9px;font-weight:500;color:var(--text2);
  padding:4px 8px;flex:1;
}

/* ══ INSTRUCCIÓN ══ */
.instruccion{
  padding:5px 16px;background:#fffbeb;
  border-bottom:1px solid #fde68a;
  font-family:'DM Mono',monospace;font-size:9px;color:#92400e;letter-spacing:.04em;
}

/* ══ SECTION HEADING ══ */
.sec-row{
  display:flex;align-items:center;gap:8px;
  padding:5px 12px;
  background:var(--bg3);
  border-top:1.5px solid var(--border3);
  border-bottom:1px solid var(--border2);
}
.sec-num{
  font-family:'DM Mono',monospace;font-size:9px;font-weight:700;
  width:18px;height:18px;border-radius:3px;
  background:var(--bg4);border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  color:var(--text2);flex-shrink:0;
}
.sec-lbl{
  font-family:'DM Mono',monospace;font-size:9px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--text2);
}
.sec-note{
  margin-left:auto;font-family:'DM Mono',monospace;font-size:8px;
  color:var(--text3);letter-spacing:.06em;
}

/* ══ MAIN MATRIX TABLE ══ */
.matrix-wrap{overflow-x:auto;}
.matrix{width:100%;border-collapse:collapse;font-size:10px;}

/* Column groups */
.matrix th, .matrix td{
  border:1px solid var(--border2);
  padding:0;vertical-align:middle;
  text-align:center;
}
.th-group{
  font-family:'DM Mono',monospace;font-size:8px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  background:var(--bg4);color:var(--text2);
  padding:5px 6px;text-align:center;
  border-bottom:1.5px solid var(--border3);
}
.th-sub{
  font-family:'DM Mono',monospace;font-size:8px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;
  background:var(--bg3);color:var(--text3);
  padding:4px 5px;text-align:center;white-space:nowrap;
  border-bottom:1.5px solid var(--border3);
}
/* Type column (leftmost) */
.col-tipo{
  background:var(--bg3);
  font-family:'DM Mono',monospace;font-size:8px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--text2);
  padding:6px 8px;text-align:left;white-space:nowrap;
  border-right:1.5px solid var(--border3);
}
.col-cat{
  background:var(--bg2);
  font-family:'DM Mono',monospace;font-size:8px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--text2);
  padding:4px 8px;text-align:left;white-space:nowrap;
  border-right:1px solid var(--border2);
}
/* Type row spanning header */
.tipo-span{
  background:var(--bg4);
  font-family:'DM Mono',monospace;font-size:8px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--text2);
  text-align:left;padding:5px 8px;
  border-right:1.5px solid var(--border3);
  border-bottom:1px solid var(--border3);
}

/* Data cells */
.dc{padding:5px 6px;font-size:10px;color:var(--text);text-align:left;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;}
.dc-c{padding:4px 3px;text-align:center;}

/* Badges inline */
.b{
  display:inline-flex;align-items:center;justify-content:center;
  font-family:'DM Mono',monospace;font-size:9px;font-weight:600;
  padding:2px 6px;border-radius:3px;border:1px solid;
  letter-spacing:.02em;white-space:nowrap;
}
.b-ok {background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok);}
.b-nc {background:var(--fail-bg);border-color:var(--fail-bd);color:var(--fail);}
.b-na {background:var(--na-bg);border-color:var(--na-bd);color:var(--na);}
.b-em {background:var(--bg2);border-color:var(--border);color:var(--text3);}

/* Compact badge just letter like physical form */
.bc{
  display:inline-flex;align-items:center;justify-content:center;
  font-family:'DM Mono',monospace;font-size:9px;font-weight:700;
  width:18px;height:18px;border-radius:3px;border:1px solid;
}
.bc-ok {background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok);}
.bc-nc {background:var(--fail-bg);border-color:var(--fail-bd);color:var(--fail);}
.bc-na {background:var(--na-bg);border-color:var(--na-bd);color:var(--na);}
.bc-em {background:var(--bg2);border-color:var(--border);color:var(--text3);}

/* PCT cell */
.pct-c{
  font-family:'DM Mono',monospace;font-size:11px;font-weight:700;
  text-align:center;padding:4px 6px;
}

/* ══ SECCIONES 2/3/4 TABLE ══ */
.small-sec{
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1fr;
  border-top:1.5px solid var(--border3);
}
.small-col{border-right:1px solid var(--border2);}
.small-col:last-child{border-right:none;}
.small-col-head{
  padding:5px 10px;background:var(--bg4);
  border-bottom:1px solid var(--border3);
  font-family:'DM Mono',monospace;font-size:8px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--text2);
}
.small-kv{padding:6px 10px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.small-kv:last-child{border-bottom:none;}
.small-lbl{font-size:10px;color:var(--text2);line-height:1.35;flex:1;}
.small-pct-box{
  grid-column:span 1;
  padding:8px 10px;display:flex;align-items:center;justify-content:center;
  border-bottom:1px solid var(--border);
}
.pct-big{font-family:'DM Mono',monospace;font-size:20px;font-weight:700;}

/* ══ LEYENDA ══ */
.leyenda{
  padding:6px 16px;background:var(--bg2);
  border-top:1px solid var(--border);
  display:flex;gap:16px;align-items:center;
  font-family:'DM Mono',monospace;font-size:9px;color:var(--text3);
  border-bottom:1px solid var(--border2);
}
.ley-item{display:flex;align-items:center;gap:5px;}

/* ══ FIRMAS ══ */
.firma-row{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  border-top:1.5px solid var(--border3);background:var(--bg2);
}
.firma-cell{padding:18px 16px;border-right:1px solid var(--border);}
.firma-cell:last-child{border-right:none;}
.firma-lbl{font-family:'DM Mono',monospace;font-size:9px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:22px;}
.firma-line{border-bottom:1px solid var(--border2);}
.firma-name{font-family:'DM Mono',monospace;font-size:11px;font-weight:600;color:var(--text);margin-bottom:6px;min-height:16px;}
.btn-verificar{background:var(--bg2);color:var(--text2);border:1px dashed var(--border3);padding:4px 10px;font-size:9px;cursor:pointer;border-radius:4px;font-family:'DM Mono',monospace;transition:all 0.2s;}
.btn-verificar:hover{background:var(--bg3);color:var(--text);border-color:var(--text3);}

/* ══ CUMPLIMIENTO GLOBAL ══ */
.global-bar{
  padding:10px 16px;
  background:var(--bg2);border-top:1px solid var(--border);
  display:flex;align-items:center;gap:16px;
  border-bottom:1px solid var(--border2);
}
.gb-lbl{font-family:'DM Mono',monospace;font-size:9px;color:var(--text3);letter-spacing:.12em;text-transform:uppercase;}
.gb-track{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;}
.gb-fill{height:100%;border-radius:3px;}
.gb-pct{font-family:'DM Mono',monospace;font-size:14px;font-weight:700;min-width:44px;text-align:right;}

/* ══ PRINT ══ */
@media print{
  body{background:#fff;padding:0;}
  .doc{box-shadow:none;border-radius:0;max-width:100%;}
  @page{margin:.8cm;size:A4 landscape;}
  .disable-print { display: none !important; }
}
@media(max-width:700px){
  .small-sec{grid-template-columns:1fr 1fr;}
  .doc-header{grid-template-columns:70px 1fr;}
  .header-codes{display:none;}
}
</style>

/* ══ HELPERS ══ */
function fmtDate(s){
  if(!s)return"—";
  const p=s.split("-");
  return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s;
}
function isDateKey(k){return /fecha|venc/i.test(k);}

function bcell(v){
  if(!v||v==="")return`<span class="bc bc-em">—</span>`;
  const l=v.toLowerCase();
  if(l==="cumple")    return`<span class="bc bc-ok">C</span>`;
  if(l==="no cumple") return`<span class="bc bc-nc">NC</span>`;
  if(l==="no aplica"||l==="n/a") return`<span class="bc bc-na">NA</span>`;
  return`<span class="bc bc-em">—</span>`;
}
function fullBadge(v){
  if(!v||v==="")return`<span class="b b-em">—</span>`;
  const l=v.toLowerCase();
  if(l==="cumple")    return`<span class="b b-ok">Cumple</span>`;
  if(l==="no cumple") return`<span class="b b-nc">No Cumple</span>`;
  if(l==="no aplica"||l==="n/a") return`<span class="b b-na">N/A</span>`;
  return`<span class="b b-em">${v}</span>`;
}
function pctColor(n){return n>=80?"var(--ok)":n>=50?"var(--na)":"var(--fail)";}

function calcStats(obj){
  let ok=0,fail=0,na=0;
  function walk(o){
    if(!o||typeof o!=="object")return;
    for(const v of Object.values(o)){
      if(typeof v==="string"){
        const l=v.toLowerCase();
        if(l==="cumple")ok++;
        else if(l==="no cumple")fail++;
        else if(l==="no aplica"||l==="n/a")na++;
      }else walk(v);
    }
  }
  walk(obj);
  return{ok,fail,na,total:ok+fail};
}

/* ══ RENDER MATRIX SECTION ══
   Builds a matrix table per "tipo" (Materias Primas, etc.)
   Rows = subcategories | Cols = data fields + check fields + pct
*/
function renderMatriz(tipoDef, tipoData){
  if(!tipoData||typeof tipoData!=="object") return "";
  let h="";

  Object.entries(tipoDef).forEach(([tipo, subcatDefs])=>{
    const tipoData2 = tipoData[tipo]||{};
    const subcatNames = Object.keys(subcatDefs);

    // Collect all info & check cols for this tipo
    const infoCols = new Set();
    const checkCols = new Set();
    const extraCols = new Set();
    subcatNames.forEach(sub=>{
      (subcatDefs[sub].info||[]).forEach(c=>infoCols.add(c));
      (subcatDefs[sub].check||[]).forEach(c=>checkCols.add(c));
      (subcatDefs[sub].extra||[]).forEach(c=>extraCols.add(c));
    });
    const iCols=[...infoCols];
    const cCols=[...checkCols];
    const eCols=[...extraCols];
    const totalCols = 1 + iCols.length + cCols.length + eCols.length + 1; // cat + info + check + extra + pct

    h+=`<table class="matrix" style="margin-bottom:0;">
      <thead>
        <tr>
          <th class="th-group" rowspan="2" style="text-align:left;padding-left:8px;width:130px;">${tipo}</th>
          ${iCols.length?`<th class="th-group" colspan="${iCols.length}">Datos del Insumo / Producto</th>`:""}
          ${cCols.length?`<th class="th-group" colspan="${cCols.length}">Verificación de Etiquetado</th>`:""}
          ${eCols.length?`<th class="th-group" colspan="${eCols.length}">Adicional</th>`:""}
          <th class="th-group" rowspan="2">Cumpl.<br>(%)</th>
        </tr>
        <tr>
          ${iCols.map(c=>`<th class="th-sub">${c}</th>`).join("")}
          ${cCols.map(c=>`<th class="th-sub" style="max-width:90px;white-space:normal;line-height:1.2;">${c}</th>`).join("")}
          ${eCols.map(c=>`<th class="th-sub">${c}</th>`).join("")}
        </tr>
      </thead>
      <tbody>`;

    subcatNames.forEach(sub=>{
      const fields = tipoData2[sub]||{};
      const def = subcatDefs[sub];
      const pctVal = fields[PCT_KEY]||"";
      const n = parseFloat(pctVal)||0;
      const pc = pctColor(n);

      h+=`<tr>
        <td class="col-cat">${sub}</td>
        ${iCols.map(c=>{
          const v = fields[c]||"";
          const display = isDateKey(c) ? fmtDate(v) : (v||"—");
          return`<td class="dc" title="${display}">${display}</td>`;
        }).join("")}
        ${cCols.map(c=>`<td class="dc-c">${bcell(fields[c])}</td>`).join("")}
        ${eCols.map(c=>`<td class="dc">${fields[c]||"—"}</td>`).join("")}
        <td class="pct-c" style="color:${n?pc:"var(--text3)"};">${pctVal?pctVal+"%":"—"}</td>
      </tr>`;
    });

    h+=`</tbody></table>`;
  });
  return h;
}

/* ══ RENDER BOTTOM SECTIONS (2/3/4) ══ */
function renderBottomSections(data, globalPct, stats){
  const s2=data.seccion2||{};
  const s3=data.seccion3||{};
  const s4=data.seccion4||{};

  // Stats per section
  function secPct(items, obj){
    let ok=0,tot=0;
    items.forEach(([k])=>{
      const v=(obj[k]||"").toLowerCase();
      if(v==="cumple"||v==="no cumple"){tot++;if(v==="cumple")ok++;}
    });
    return tot?Math.round((ok/tot)*100):null;
  }
  const s2items_all=[...Object.values(S2_GRUPOS).flat()];
  const p2=secPct(s2items_all,s2);
  const p3=secPct(S3_ITEMS,s3);
  const p4=secPct(S4_ITEMS,s4);

  let h=`<div class="small-sec">`;

  // SEC 2 — dos grupos
  h+=`<div class="small-col" style="grid-column:span 2;">
    <div class="small-col-head">Sección 2 — PNC's</div>`;
  Object.entries(S2_GRUPOS).forEach(([grp, items])=>{
    h+=`<div style="padding:4px 10px 2px;font-family:'DM Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border);background:var(--bg2);">${grp}</div>`;
    items.forEach(([k,lbl])=>{
      h+=`<div class="small-kv"><span class="small-lbl">${lbl}</span>${fullBadge(s2[k])}</div>`;
    });
  });
  h+=`</div>`;

  // SEC 3
  h+=`<div class="small-col">
    <div class="small-col-head">Sección 3 — Insumos en líneas de producción</div>`;
  S3_ITEMS.forEach(([k,lbl])=>{
    h+=`<div class="small-kv"><span class="small-lbl">${lbl}</span>${fullBadge(s3[k])}</div>`;
  });
  h+=`</div>`;

  // SEC 4
  h+=`<div class="small-col">
    <div class="small-col-head">Sección 4 — Etiquetas / empaques defectuosos</div>`;
  S4_ITEMS.forEach(([k,lbl])=>{
    h+=`<div class="small-kv"><span class="small-lbl">${lbl}</span>${fullBadge(s4[k])}</div>`;
  });
  h+=`</div>`;

  h+=`</div>`;

  // Cumplimientos por sección + global
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;border-top:1px solid var(--border);background:var(--bg2);">`;
  [
    ["Cumplimiento Global", globalPct, true],
    ["Secc. 2 — PNC's", p2, false],
    ["Secc. 3 — Líneas", p3, false],
    ["Secc. 4 — No Conformes", p4, false],
    ["Criterios evaluados", stats.total, false, true]
  ].forEach(([lbl,val,isGlobal,isCount])=>{
    const n=parseFloat(val)||0;
    const pc=isCount?"var(--text2)":pctColor(n);
    const display=isCount?(val||"—"):(val!==null?val+"%":"—");
    h+=`<div style="padding:10px 12px;border-right:1px solid var(--border);text-align:center;${isGlobal?"background:var(--bg3);":""}">
      <div style="font-family:'DM Mono',monospace;font-size:8px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;">${lbl}</div>
      <div style="font-family:'DM Mono',monospace;font-size:${isGlobal?"22":"18"}px;font-weight:700;color:${pc};">${display}</div>
      ${isGlobal?`<div style="margin-top:6px;display:flex;justify-content:center;gap:10px;">
        <span style="font-family:'DM Mono',monospace;font-size:9px;color:var(--ok);">${stats.ok} C</span>
        <span style="font-family:'DM Mono',monospace;font-size:9px;color:var(--fail);">${stats.fail} NC</span>
        <span style="font-family:'DM Mono',monospace;font-size:9px;color:var(--na);">${stats.na} NA</span>
      </div>`:""}
    </div>`;
  });
  h+=`</div>`;

  return h;
}

/* ══ API FIRMA ══ */
window.firmarJefe = function(fName) {
  if (!confirm("¿Confirmas que deseas firmar/verificar esta inspección usando tu usuario actualmente conectado?")) return;
  fetch('api_firmar_jefe.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ file: fName, zona: zonaParam })
  })
  .then(r => r.json())
  .then(data => {
    if (data.status === 'ok') location.reload();
    else alert('Atención: ' + data.message);
  })
  .catch(err => {
    console.error(err);
    alert('Ocurrió un error al firmar.');
  });
};

                 así en el archivo).
                 En reposo se ven tres escudos; la hoja (.area-leaf) está oculta.
                 Al hacer click el escudo más pequeño se vuelve blanco, se
                 transforma en la silueta de la hoja (.area-leaf-morph), un
                 resplandor (.area-leaf-glow) acompaña el cierre, el blanco se
                 disuelve dejando la hoja con su color y un destello
                 (.area-leaf-shine) la recorre; recién entonces arranca la
                 transición — ver playAreaLeaf en src/app.ts.

                 (bbox 1759..2014 × 289..620, centro 1886.5,454.5) al viewBox
                 200x200 (centro 100,100), a escala 0.57.

                                                (máscara #area-leaf-knockout)
                       .area-counter-rotator  → escudo exterior: gira en sentido opuesto
                                                al interno (−ángulo)
                       .area-settle-rotator   → escudo interno: gira siguiendo al mouse
                                                (se atraviesan de costado); en el click
                                                todos vuelven a 0° antes de la hoja

                                                el click se vuelve blanco y se transforma
                                                en la hoja (.area-leaf-morph)

                       .area-leaf-shine       → destello diagonal (recortado a la hoja)
